<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do TypeScript</title>
</head>
<body>
  <h1>To-Do List</h1>

  <form id="todoForm">
    <input
      id="todoInput"
      type="text"
      placeholder="Masukkan tugas"
    >

    <button type="submit">Tambah</button>
  </form>

  <ul id="todoList"></ul>

  <!-- Yang dijalankan browser adalah file hasil kompilasi -->
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
